[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind==2.13.0",
    "pyarrow>=24,<25",
]
build-backend = "scikit_build_core.build"

[project]
name = "hgraph-kafka"
version = "0.1.0"
description = "C++-first Kafka services for hgraph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["hg_cpp>=0.4.18", "frozendict>=2"]

[project.urls]
Homepage = "https://github.com/hhenson/hg_cpp"
Repository = "https://github.com/hhenson/hg_cpp.git"

[tool.uv.sources]
hg-cpp = {workspace = true}

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.source-dir = "."
cmake.args = [
    "-DHGRAPH_KAFKA_BUILD_PYTHON=ON",
    "-DHGRAPH_KAFKA_FORCE_FETCH_LIBRDKAFKA=ON",
    "-DBUILD_TESTING=OFF",
]
install.components = ["Python"]
wheel.packages = ["python/hgraph_kafka", "python/hgraph"]
wheel.py-api = "cp312"
sdist.include = [
    "CMakeLists.txt",
    "CHANGELOG.md",
    "LICENSE",
    "cmake/**",
    "include/**",
    "python/**",
    "src/**",
    "tests/**",
    "test_package/**",
    "tools/**",
]
