[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind==2.13.0",
    "pyarrow>=26,<27",
    "hgraph>=0.8.39",
]
build-backend = "scikit_build_core.build"

[project]
name = "hgraph-analytics"
version = "0.0.0"
description = "C++-first numerical analytics for hgraph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["hgraph>=0.8.39"]

[project.urls]
Homepage = "https://github.com/hhenson/hgraph"
Repository = "https://github.com/hhenson/hgraph.git"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.source-dir = "."
cmake.args = [
    "-DHGRAPH_ANALYTICS_BUILD_PYTHON=ON",
    "-DBUILD_TESTING=OFF",
]
install.components = ["Python", "Development"]
wheel.packages = ["python/hgraph_analytics"]
wheel.py-api = "cp312"
sdist.include = [
    "CMakeLists.txt",
    "CHANGELOG.md",
    "LICENSE",
    "README.md",
    "cmake/**",
    "include/**",
    "python/**",
    "src/**",
    "tests/**",
    "test_package/**",
    "tools/**",
]
