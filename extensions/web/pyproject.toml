[build-system]
requires = [
    "scikit-build-core>=0.11",
    "nanobind==2.13.0",
    "pyarrow>=25,<26",
    "hgraph>=0.8.0",
]
build-backend = "scikit_build_core.build"

[project]
name = "hgraph-web"
# Release artifacts are restamped from the shared x.x.x tag by release-wheels.yml.
version = "0.0.0"
description = "HTTP/S and WebSocket transport extension for hgraph"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
dependencies = ["hgraph>=0.8.0", "frozendict>=2"]

[project.urls]
Homepage = "https://github.com/hhenson/hgraph"
Repository = "https://github.com/hhenson/hgraph.git"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.scikit-build]
cmake.source-dir = "."
cmake.args = [
    "-DHGRAPH_WEB_BUILD_PYTHON=ON",
    "-DBUILD_TESTING=OFF",
]
install.components = ["Python"]
wheel.packages = ["python/hgraph_web"]
wheel.py-api = "cp312"
sdist.include = [
    "CMakeLists.txt",
    "CHANGELOG.md",
    "LICENSE",
    "cmake/**",
    "include/**",
    "python/**",
    "src/**",
    "tests/**",
    "test_package/**",
    "tools/**",
]
