name: Nightly differential parity campaign

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

concurrency:
  group: parity-nightly
  cancel-in-progress: false

permissions:
  contents: read

env:
  GCC_VERSION: "14"

jobs:
  build-candidate:
    name: Build candidate wheel
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Enable shared compiler cache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.15.0
      - name: Configure GCC 14
        shell: bash
        run: |
          cc_path="$(command -v "gcc-$GCC_VERSION")"
          cxx_path="$(command -v "g++-$GCC_VERSION")"
          test "$("$cxx_path" -dumpfullversion -dumpversion | cut -d. -f1)" -eq "$GCC_VERSION"
          echo "CC=$cc_path" >> "$GITHUB_ENV"
          echo "CXX=$cxx_path" >> "$GITHUB_ENV"
          "$cxx_path" --version
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install build tools
        run: >-
          python -m pip install --upgrade --only-binary=:all: "uv==0.12.3"
      - name: Build the stable-ABI candidate wheel
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
        run: >-
          uv build
          --wheel
          --python 3.12
          --config-setting cmake.build-type=Release
          --out-dir dist
          --no-build-logs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parity-candidate-wheel
          path: dist/*.whl
          if-no-files-found: error
      # The frame-recording scenarios need hgraph-persistence in the
      # candidate environment (RFC 0025); build its wheel against the
      # candidate core SDK. Like the core candidate wheel, it is an
      # unrepaired campaign-internal artifact, not a release wheel.
      - name: Install the candidate core SDK
        # The wheel is this run's own artifact; --no-deps resolves nothing
        # from an index (same install shape as release-platform-wheel).
        shell: python
        run: |
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          subprocess.check_call(
              [sys.executable, "-m", "pip", "install", "--no-deps", str(wheels[0])]
          )
      - name: Install extension build tools
        run: >-
          python -m pip install --only-binary=:all:
          "build==1.5.0" "scikit-build-core==1.0.3" "nanobind==2.13.0"
          "ninja==1.13.0" "pyarrow==25.0.0"
      - name: Locate the installed core SDK
        shell: python
        run: |
          from importlib import metadata
          import os
          from pathlib import Path

          distribution = metadata.distribution("hgraph")
          sdk_prefix = Path(distribution.locate_file("")).resolve()
          config = sdk_prefix / "lib" / "cmake" / "hgraph" / "hgraphConfig.cmake"
          if not config.is_file():
              raise FileNotFoundError(f"installed hgraph CMake package not found: {config}")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              env_file.write(f"HGRAPH_EXTENSION_SDK_PREFIX={sdk_prefix}\n")
      - name: Build the candidate persistence wheel
        env:
          CMAKE_GENERATOR: Ninja
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          CMAKE_PREFIX_PATH: ${{ env.HGRAPH_EXTENSION_SDK_PREFIX }}
        run: >-
          python -m build --wheel --no-isolation --skip-dependency-check
          --outdir persistence-dist extensions/persistence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: parity-candidate-persistence-wheel
          path: persistence-dist/*.whl
          if-no-files-found: error

  campaign:
    name: Campaign shard ${{ matrix.shard }}
    needs: build-candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install parity controller
        run: >-
          python -m pip install --upgrade --only-binary=:all:
          "uv==0.12.3" "hypothesis==6.165.2"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: parity-candidate-wheel
          path: dist
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: parity-candidate-persistence-wheel
          path: persistence-dist
      - name: Restore released-hgraph traces
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            .parity/envs/reference-*
            .parity/cache/reference-traces
          key: parity-reference-${{ runner.os }}-py314-${{ matrix.shard }}-${{ hashFiles('tools/parity/**/*.py') }}
          restore-keys: |
            parity-reference-${{ runner.os }}-py314-${{ matrix.shard }}-
      - name: Run bounded nightly campaign
        run: >-
          python -m tools.parity campaign
          --profile nightly
          --seed ${{ github.run_number }}
          --shard-index ${{ matrix.shard }}
          --shard-count 8
          --candidate-wheel dist/*.whl
          --candidate-extra-wheel persistence-dist/*.whl
          --exit-zero
          --output-dir parity-results
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: parity-report-${{ matrix.shard }}
          path: parity-results
          if-no-files-found: error

  publish:
    name: Publish verified parity issues
    needs: campaign
    if: always() && needs.campaign.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: parity-report-*
          path: parity-reports
      - name: Create or update deduplicated issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python -m tools.parity publish-issues
          parity-reports/*/report.json
          --repo ${{ github.repository }}
          --publish
