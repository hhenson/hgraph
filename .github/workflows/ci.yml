name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  build-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      HGRAPH_SMOKE_PYTHONS: "3.12 3.13 3.14"
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7

      - name: Restore uv/pip caches
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-uvpip-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-uvpip-

      # Build the ABI3 wheel against the 3.12 stable ABI baseline.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'

      # Ensure Conan is available for builds/tools
      - name: Install Conan via uv tool
        run: uv tool install --upgrade conan==2.26.2

      # Build the wheel with nanobind stable ABI enabled
      - name: Build wheel (NB stable ABI, Windows MSVC)
        if: runner.os == 'Windows'
        env:
          CMAKE_ARGS: -DNB_USE_STABLE_ABI=ON
          CMAKE_GENERATOR: "Visual Studio 18 2026"
          CMAKE_GENERATOR_PLATFORM: x64
        run: uv build -v

      - name: Build wheel (NB stable ABI, Unix Ninja)
        if: runner.os != 'Windows'
        env:
          CMAKE_ARGS: -DNB_USE_STABLE_ABI=ON
          CMAKE_GENERATOR: Ninja
        run: uv build -v

      - name: Prepare test environment (dependencies only, skip project build)
        run: |
          uv venv
          uv sync --all-extras --all-groups --no-install-project

      - name: List dist artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path dist) { Get-ChildItem dist | Format-Table Name,Length,LastWriteTime -AutoSize } else { Write-Host "dist directory not found" }
      - name: List dist artifacts (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ls -la dist || true

      - name: Upload built wheels (all OS)
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-${{ runner.os }}
          path: dist/**
          if-no-files-found: ignore
          retention-days: 7

      # Repair Linux wheel to manylinux using auditwheel (do not publish unrepaired wheels)
      - name: Repair Linux wheel with auditwheel (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ls -la dist || true
          wheel=$(ls dist/*.whl | head -n1 || true)
          if [ -z "${wheel}" ]; then
            echo "No wheel found in dist/"
            exit 1
          fi
          uv pip install --upgrade pip
          uv pip install auditwheel
          # Show before/after info for debugging
          .venv/bin/python -m auditwheel show "${wheel}" || true
          mkdir -p wheelhouse
          .venv/bin/python -m auditwheel repair -w wheelhouse "${wheel}"
          ls -la wheelhouse || true

      - name: Upload repaired Linux wheels (manylinux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: wheels-linux-manylinux
          path: wheelhouse/**
          if-no-files-found: error
          retention-days: 7

      - name: Resolve built wheel path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $wheel = (Get-ChildItem dist/*.whl | Select-Object -First 1).FullName
          if (-not $wheel) { Write-Error "No wheel found in dist/"; Get-ChildItem dist -Recurse; exit 1 }
          "HGRAPH_WHEEL=$wheel" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve built wheel path (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Linux" ] && compgen -G "wheelhouse/*.whl" > /dev/null; then
            wheel=$(ls wheelhouse/*.whl | head -n1)
          else
            wheel=$(ls dist/*.whl | head -n1 || true)
          fi
          if [ -z "${wheel}" ]; then
            echo "No wheel found for smoke/full-test install"
            ls -la dist || true
            ls -la wheelhouse || true
            exit 1
          fi
          echo "HGRAPH_WHEEL=${wheel}" >> "${GITHUB_ENV}"

      - name: Install built wheel into primary env (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv pip install --upgrade pip
          uv pip install "$env:HGRAPH_WHEEL"

      - name: Install built wheel into primary env (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uv pip install --upgrade pip
          uv pip install "${HGRAPH_WHEEL}"

      - name: Run ABI3 smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Rename-Item hgraph hgraph_src
          try {
            foreach ($pyver in $env:HGRAPH_SMOKE_PYTHONS.Split(' ')) {
              $venvPython = Join-Path $PWD ".venv-smoke-$pyver\Scripts\python.exe"
              uv venv --clear ".venv-smoke-$pyver" --python $pyver
              uv pip install --python $venvPython --upgrade pip
              uv pip install --python $venvPython pytest tornado requests pandas "perspective-python<4.0.0" kafka-python matplotlib "$env:HGRAPH_WHEEL"
              foreach ($useCpp in @('false', 'true')) {
                Write-Host "Smoke test: python=$pyver HGRAPH_USE_CPP=$useCpp wheel=$env:HGRAPH_WHEEL"
                $env:HGRAPH_USE_CPP = $useCpp
                & (Join-Path $PWD ".venv-smoke-$pyver\Scripts\pytest.exe") hgraph_unit_tests -q -m smoke
              }
            }
          } finally {
            Remove-Item Env:HGRAPH_USE_CPP -ErrorAction SilentlyContinue
            Rename-Item hgraph_src hgraph
          }

      - name: Run ABI3 smoke tests (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mv hgraph hgraph_src
          trap 'mv hgraph_src hgraph' EXIT
          for pyver in ${HGRAPH_SMOKE_PYTHONS}; do
            uv venv --clear ".venv-smoke-${pyver}" --python "${pyver}"
            uv pip install --python ".venv-smoke-${pyver}/bin/python" --upgrade pip
            uv pip install --python ".venv-smoke-${pyver}/bin/python" pytest tornado requests pandas "perspective-python<4.0.0" kafka-python matplotlib "${HGRAPH_WHEEL}"
            for use_cpp in false true; do
              echo "Smoke test: python=${pyver} HGRAPH_USE_CPP=${use_cpp} wheel=${HGRAPH_WHEEL}"
              HGRAPH_USE_CPP="${use_cpp}" ".venv-smoke-${pyver}/bin/pytest" hgraph_unit_tests -q -m smoke
            done
          done

  # The full suite, run against the built wheel on every supported Python.
  #
  # The wheel is abi3, built once against the 3.12 stable ABI, so the same artifact is exercised on
  # 3.13 and 3.14 rather than rebuilt per version. Splitting this out of build-test means a failure
  # names the version and runtime it belongs to, instead of hiding inside the Linux build leg.
  test-matrix:
    name: Test suite (py${{ matrix.python-version }}, ${{ matrix.runtime }} runtime)
    needs: build-test
    runs-on: ubuntu-latest
    # The C++ runtime is not yet at parity with the Python reference implementation, so its legs
    # report without blocking. This matches the behaviour of the steps this job replaces.
    #
    # Note that 3.14 is NOT exempted here. It aborts during interpreter finalisation
    # ("Fatal Python error: gilstate_tss_set", SIGABRT/134) once the hgraph_unit_tests/adaptors
    # group has run, but that happens after pytest has reported, so the run step distinguishes it
    # from a genuine test failure rather than the whole leg being made optional. A 3.14-only
    # regression still fails CI.
    continue-on-error: ${{ matrix.runtime == 'cpp' }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]
        runtime: [ 'python', 'cpp' ]
        # Coverage is measured once, on the reference leg; the other five would report the same
        # lines at six times the cost. Undefined for every other combination, expanding to nothing.
        include:
          - python-version: '3.12'
            runtime: 'python'
            coverage_args: '--cov=hgraph --cov-report=xml'
    env:
      HGRAPH_USE_CPP: ${{ matrix.runtime == 'cpp' && 'true' || 'false' }}
      PYTHONFAULTHANDLER: '1'
    steps:
      - uses: actions/checkout@v7

      # Pinned, and matching the build job, rather than `pip install --upgrade uv`, which resolves
      # to an unverified version at run time.
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v7
        with:
          name: wheels-linux-manylinux
          path: dist

      - name: Sync test dependencies (project itself comes from the wheel)
        run: uv sync --frozen --all-extras --all-groups --no-install-project --python ${{ matrix.python-version }}

      - name: Install built wheel
        shell: python
        run: |
          import subprocess, sys
          from pathlib import Path

          wheels = sorted(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, f"expected exactly one wheel, found {wheels}"
          venv_python = Path(".venv") / ("Scripts/python.exe" if sys.platform == "win32" else "bin/python")
          subprocess.check_call(["uv", "pip", "install", "--python", str(venv_python), str(wheels[0])])

      - name: Confirm the wheel is what gets imported
        shell: bash
        run: |
          set -euo pipefail
          # Hide the source tree so a stale local copy cannot shadow the installed wheel.
          mv hgraph hgraph_src
          trap 'mv hgraph_src hgraph' EXIT
          .venv/bin/python -c "import importlib.util as u; m=u.find_spec('hgraph._hgraph'); print('_hgraph:', getattr(m,'origin',None) or 'not installed')"
          .venv/bin/python -c "import hgraph; print('hgraph:', hgraph.__file__)"
          .venv/bin/python -c "import sys; print('python:', sys.version)"

      # pytest's exit status is not usable on its own here: on 3.14 the interpreter can abort during
      # finalisation, after the run has completed and reported, turning a green run into SIGABRT.
      # So the verdict comes from the JUnit report, which is written before finalisation, and the
      # process status is only consulted to catch a crash that happened *during* the run.
      - name: Run test suite
        shell: bash
        run: |
          echo "python=${{ matrix.python-version }} HGRAPH_USE_CPP=${HGRAPH_USE_CPP}"
          ulimit -c unlimited || true
          mv hgraph hgraph_src
          trap 'mv hgraph_src hgraph' EXIT
          set +e
          .venv/bin/pytest hgraph_unit_tests docs -ra -q \
            --junitxml=pytest-report.xml ${{ matrix.coverage_args }}
          pytest_status=$?
          set -e
          echo "pytest exit status: ${pytest_status}"
          .venv/bin/python - "${pytest_status}" <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path

          status = int(sys.argv[1])
          report = Path("pytest-report.xml")

          if not report.is_file():
              sys.exit(f"FAIL: pytest produced no report; it died before finishing (status {status}).")

          suites = ET.parse(report).getroot().iter("testsuite")
          totals = {k: 0 for k in ("tests", "failures", "errors", "skipped")}
          for suite in suites:
              for k in totals:
                  totals[k] += int(suite.get(k, 0))
          print("report:", ", ".join(f"{k}={v}" for k, v in totals.items()))

          if totals["failures"] or totals["errors"]:
              sys.exit("FAIL: the run reported test failures or errors.")
          if totals["tests"] == 0:
              sys.exit("FAIL: the report contains no tests; collection probably failed.")
          if status == 0:
              print("PASS")
              sys.exit(0)
          # Every test passed but the process still died. Tolerated only for the known
          # post-run finalisation abort; anything else is a real crash during the run.
          if status > 128:
              print(
                  f"PASS (with warning): all tests passed but the process exited on signal "
                  f"{status - 128} after reporting. This is the known interpreter-finalisation "
                  f"abort; see the crash artifacts for detail."
              )
              sys.exit(0)
          sys.exit(f"FAIL: tests reported clean but pytest exited {status}.")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: pytest-report-py${{ matrix.python-version }}-${{ matrix.runtime }}
          path: pytest-report.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Collect crash artifacts
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          echo "Collecting core dumps and backtraces..."
          sudo apt-get update >/dev/null 2>&1 || true
          sudo apt-get install -y gdb >/dev/null 2>&1 || true
          shopt -s nullglob || true
          CORES=(core core.* /var/crash/*.crash /var/crash/*.core /home/runner/work/*/*/core*)
          echo "Found ${#CORES[@]} core candidates"
          for c in "${CORES[@]}"; do
            echo "==> Core file: $c"
            file "$c" || true
            gdb -q -n -batch -ex "set pagination off" -ex "thread apply all bt full" -ex "quit" "$(which python)" "$c" || true
          done

      - name: Upload core dumps
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: core-dumps-py${{ matrix.python-version }}-${{ matrix.runtime }}
          path: |
            core*
            /var/crash/*.crash
            /var/crash/*.core
            /home/runner/work/*/*/core*
          if-no-files-found: ignore
          retention-days: 7
