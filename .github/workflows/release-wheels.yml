name: Release Wheels (cibuildwheel)

# Release-grade distributions are built and smoke-tested when a commit lands on main, not when it
# is tagged. Tagging then publishes what has already been built and tested for that exact commit,
# rewriting only the version. A release becomes a metadata operation plus an upload.
#
# This works because the build is version-agnostic: nothing writes the tag into the source before
# compiling, so the artifacts a main push produces are byte-identical to what a tag build would
# have produced, and the version is stamped into the distribution metadata at publish time.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
      - 'v_*.*.*'

permissions:
  actions: read
  contents: read

env:
  SCCACHE_GHA_ENABLED: "true"

jobs:
  # Building and smoke-testing the release wheels takes the better part of an hour across three
  # runners. If this exact commit has already been through that successfully, there is nothing to
  # learn from doing it again, so those artifacts are reused.
  #
  # Matching is on the commit alone. A run from any ref will do, because the version is not baked
  # in at build time; the publish job restamps it from the tag.
  reuse-build:
    name: Find already-built distributions for this commit
    runs-on: ubuntu-latest
    outputs:
      run-id: ${{ steps.find.outputs.run-id }}
    steps:
      - name: Find a successful run for this commit
        id: find
        uses: actions/github-script@v8
        with:
          script: |
            const required = new Set([
              "release-wheels-Linux",
              "release-wheels-macOS",
              "release-wheels-Windows",
              "release-sdist",
            ]);

            const runs = await github.paginate(github.rest.actions.listWorkflowRuns, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "release-wheels.yml",
              head_sha: context.sha,
              status: "success",
              per_page: 100,
            });

            for (const run of runs) {
              if (run.id === context.runId || run.head_sha !== context.sha) continue;

              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const available = new Set(
                artifacts.filter((a) => !a.expired).map((a) => a.name),
              );
              if ([...required].every((name) => available.has(name))) {
                core.notice(`Reusing distributions already built and tested by run ${run.id}`);
                core.setOutput("run-id", String(run.id));
                return;
              }
            }

            core.notice(`No reusable distributions for ${context.sha}; building from source.`);
            core.setOutput("run-id", "");

  build-wheels:
    name: Build wheels (${{ matrix.os }})
    needs: reuse-build
    if: needs.reuse-build.outputs.run-id == ''
    runs-on: ${{ matrix.os }}
    env:
      HGRAPH_SMOKE_PYTHONS: "3.12 3.13 3.14"
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]

    steps:
      - uses: actions/checkout@v7

      - name: Show trigger inputs
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "publish_testpypi=${{ inputs.publish_testpypi }}"

      - name: Setup uv (Python 3.12 ABI3 baseline)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: '3.12'

      - name: Cache uv/pip
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/uv
            ~/.cache/pip
          key: ${{ runner.os }}-cibw-uvpip-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-cibw-uvpip-

      # Deliberately no version stamping here. The build stays version-agnostic so that the
      # artifacts a main push produces are reusable by whatever tag is cut from that commit later;
      # the publish job writes the tag version into the distribution metadata instead.

      - name: Install tooling
        run: |
          uv tool install --upgrade cibuildwheel==3.4.0
          uv tool install --upgrade conan==2.26.2

      - name: Build wheels with cibuildwheel
        env:
          # Build once on CPython 3.12 and publish ABI3 wheels for 3.12+.
          CIBW_BUILD: cp312-*
          # macOS: build Apple Silicon wheels only
          CIBW_ARCHS_MACOS: arm64
          # Ensure the wheel tag matches the binary minimum target (avoid delocate mismatch)
          CIBW_MACOSX_DEPLOYMENT_TARGET: "15.0"
          # Instruct delocate (repair step) to update the wheel tag to 15.0 as well
          CIBW_REPAIR_WHEEL_COMMAND_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=15.0 delocate-wheel --require-archs arm64 -w {dest_dir} -v {wheel}
          # Windows: build 64-bit wheels only (avoid win32 toolchain issues)
          CIBW_ARCHS_WINDOWS: AMD64
          # Enable nanobind stable ABI at CMake level
          CMAKE_ARGS: -DNB_USE_STABLE_ABI=ON
          # Global env visible during builds inside cibuildwheel
          CIBW_ENVIRONMENT: >-
            SKBUILD_VERBOSE=1
          # Linux: disable backward-cpp to avoid execinfo.h / non-portable deps in manylinux
          # Re-state CMAKE_ARGS to include both flags on Linux and prefer Ninja
          CIBW_ENVIRONMENT_LINUX: >-
            CMAKE_ARGS="-DNB_USE_STABLE_ABI=ON -DHGRAPH_WITH_BACKWARD=OFF" CMAKE_GENERATOR=Ninja SKBUILD_VERBOSE=1
          # Windows: prefer Visual Studio generator to ensure cl.exe is used and on PATH
          CIBW_ENVIRONMENT_WINDOWS: >-
            CMAKE_GENERATOR="Visual Studio 18 2026" CMAKE_GENERATOR_PLATFORM=x64 SKBUILD_VERBOSE=1
          # Apply env for all macOS builds so the wheel tag matches binary min target
          CIBW_ENVIRONMENT_MACOS: >-
            MACOSX_DEPLOYMENT_TARGET=15.0 SKBUILD_VERBOSE=1
          # Explicit arch + generator for macOS builds
          CIBW_ENVIRONMENT_MACOS_ARM64: >-
            CMAKE_OSX_ARCHITECTURES=arm64 MACOSX_DEPLOYMENT_TARGET=15.0 CMAKE_OSX_DEPLOYMENT_TARGET=15.0 CMAKE_GENERATOR=Ninja SKBUILD_VERBOSE=1
        run: |
          uvx --from cibuildwheel==3.4.0 cibuildwheel --output-dir wheelhouse

      - name: Build sdist (source distribution)
        run: |
          uv build -v --sdist

      - name: Validate wheels metadata (twine check) [Unix]
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          uvx --from twine==6.2.0 twine check wheelhouse/*
          if compgen -G "dist/*.tar.gz" > /dev/null; then uvx --from twine==6.2.0 twine check dist/*.tar.gz; fi

      - name: Validate wheels metadata (twine check) [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "wheelhouse") {
            $wheels = Get-ChildItem "wheelhouse/*.whl" -ErrorAction SilentlyContinue
            if ($wheels) { uvx --from twine==6.2.0 twine check wheelhouse/*.whl }
          } else { Write-Host "wheelhouse not found" }

      - name: Test built wheels with ABI3 smoke tests [Linux/macOS]
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          ls -la wheelhouse || true
          if ! compgen -G "wheelhouse/*.whl" > /dev/null; then echo "No wheels built"; exit 1; fi
          mv hgraph hgraph_src
          trap 'mv hgraph_src hgraph' EXIT
          for wheel in wheelhouse/*.whl; do
            if [ "${RUNNER_OS}" = "Linux" ] && [[ "${wheel}" == *musllinux* ]]; then
              echo "Skipping musllinux wheel on glibc runner: ${wheel}"
              continue
            fi
            for pyver in ${HGRAPH_SMOKE_PYTHONS}; do
              uv venv --clear ".venv-test-${pyver}" --python "${pyver}"
              uv pip install --python ".venv-test-${pyver}/bin/python" --upgrade pip
              uv pip install --python ".venv-test-${pyver}/bin/python" --reinstall pytest tornado requests pandas "perspective-python<4.0.0" kafka-python matplotlib "${wheel}"
              for use_cpp in false true; do
                echo "Smoke test: wheel=${wheel} python=${pyver} HGRAPH_USE_CPP=${use_cpp}"
                HGRAPH_USE_CPP="${use_cpp}" ".venv-test-${pyver}/bin/pytest" hgraph_unit_tests -q -m smoke
              done
            done
          done

      - name: Test built wheels with ABI3 smoke tests [Windows]
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path wheelhouse) { Get-ChildItem wheelhouse | Format-Table Name,Length,LastWriteTime -AutoSize } else { Write-Host "wheelhouse not found" }
          $wheels = Get-ChildItem wheelhouse/*.whl -ErrorAction SilentlyContinue
          if (-not $wheels) { Write-Error "No wheels built"; exit 1 }
          Rename-Item hgraph hgraph_src
          try {
            foreach ($wheel in $wheels) {
              foreach ($pyver in $env:HGRAPH_SMOKE_PYTHONS.Split(' ')) {
                $venvPython = Join-Path $PWD ".venv-test-$pyver\Scripts\python.exe"
                uv venv --clear ".venv-test-$pyver" --python $pyver
                uv pip install --python $venvPython --upgrade pip
                uv pip install --python $venvPython --reinstall pytest tornado requests pandas "perspective-python<4.0.0" kafka-python matplotlib $wheel.FullName
                foreach ($useCpp in @('false', 'true')) {
                  Write-Host "Smoke test: wheel=$($wheel.Name) python=$pyver HGRAPH_USE_CPP=$useCpp"
                  $env:HGRAPH_USE_CPP = $useCpp
                  & (Join-Path $PWD ".venv-test-$pyver\Scripts\pytest.exe") hgraph_unit_tests -q -m smoke
                }
              }
            }
          } finally {
            Remove-Item Env:HGRAPH_USE_CPP -ErrorAction SilentlyContinue
            Rename-Item hgraph_src hgraph
          }

      - name: Upload wheels
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-wheels-${{ runner.os }}
          path: wheelhouse/**
          if-no-files-found: error
          retention-days: 14

      - name: Upload sdist (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-sdist
          path: dist/*.tar.gz
          if-no-files-found: ignore
          retention-days: 14


  publish:
    name: Publish to PyPI
    needs: [ reuse-build, build-wheels ]
    # Publish when the build succeeded, or when it was skipped because a previous run for this
    # exact commit had already produced and tested the distributions.
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/') &&
      needs.reuse-build.result == 'success' &&
      (
        needs.reuse-build.outputs.run-id != '' ||
        needs.build-wheels.result == 'success'
      )
    runs-on: ubuntu-latest
    environment:
      name: release
    permissions:
      actions: read
      id-token: write
      contents: write
      pull-requests: write
    steps:
      - name: Report distribution source
        run: |
          if [ -n "${{ needs.reuse-build.outputs.run-id }}" ]; then
            echo "Reusing distributions from run ${{ needs.reuse-build.outputs.run-id }}"
          else
            echo "Using distributions built by this run (${{ github.run_id }})"
          fi

      - name: Download release artifacts (wheels + sdist)
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist_all
          pattern: release-*
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ needs.reuse-build.outputs.run-id || github.run_id }}

      - name: Collect distributions into a single folder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p to_upload
          shopt -s globstar nullglob
          # Gather .whl and .tar.gz from all artifacts (recursively)
          for f in dist_all/**/*.whl dist_all/**/*.tar.gz; do
            [ -e "$f" ] || continue
            cp "$f" to_upload/
          done
          echo "Collected distributions:" && ls -la to_upload || true

      # The tag is the version authority. The distributions were built, and fully tested, at
      # whatever version pyproject.toml carried on that commit. Rewriting the version is a
      # metadata-only operation, so the expensive compiled artifacts are reused byte-for-byte.
      - name: Restamp distributions to the tag version
        shell: python
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          import base64, csv, hashlib, io, os, re, tarfile, zipfile
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          version = tag[2:] if tag.startswith("v_") else tag[1:] if tag.startswith("v") else tag
          print(f"tag {tag} -> version {version}")

          def record_hash(data: bytes) -> str:
              digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest())
              return "sha256=" + digest.decode().rstrip("=")

          def restamp_wheel(path: Path) -> None:
              name, old_version, _rest = path.name.split("-", 2)
              if old_version == version:
                  print(f"{path.name}: already at {version}")
                  return
              old_info, new_info = f"{name}-{old_version}.dist-info", f"{name}-{version}.dist-info"
              with zipfile.ZipFile(path) as archive:
                  entries = {i.filename: archive.read(i.filename) for i in archive.infolist()}

              renamed = {}
              for item_name, data in entries.items():
                  new_name = item_name.replace(old_info + "/", new_info + "/")
                  if new_name == f"{new_info}/METADATA":
                      text, count = re.subn(
                          rf"(?m)^Version: {re.escape(old_version)}$",
                          f"Version: {version}",
                          data.decode(),
                          count=1,
                      )
                      assert count == 1, f"{path.name}: METADATA Version line not found"
                      data = text.encode()
                  renamed[new_name] = data

              # RECORD lists every file with its hash and size, so it has to be rebuilt after the
              # dist-info rename and the METADATA edit, or the wheel fails installation checks.
              record_name = f"{new_info}/RECORD"
              rows = []
              for row in csv.reader(io.StringIO(renamed[record_name].decode())):
                  if not row:
                      continue
                  entry = row[0].replace(old_info + "/", new_info + "/")
                  if entry == record_name:
                      rows.append([entry, "", ""])       # RECORD cannot hash itself
                  else:
                      rows.append([entry, record_hash(renamed[entry]), str(len(renamed[entry]))])
              buffer = io.StringIO(newline="")
              csv.writer(buffer, lineterminator="\n").writerows(rows)
              renamed[record_name] = buffer.getvalue().encode()

              new_path = path.with_name(path.name.replace(f"-{old_version}-", f"-{version}-", 1))
              with zipfile.ZipFile(new_path, "w", zipfile.ZIP_DEFLATED) as archive:
                  for item_name, data in renamed.items():
                      archive.writestr(item_name, data)
              if new_path != path:
                  path.unlink()
              print(f"{path.name} -> {new_path.name}")

          def restamp_sdist(path: Path) -> None:
              name, old_version = path.name.removesuffix(".tar.gz").rsplit("-", 1)
              if old_version == version:
                  print(f"{path.name}: already at {version}")
                  return
              old_root, new_root = f"{name}-{old_version}", f"{name}-{version}"
              members = []
              with tarfile.open(path, "r:gz") as archive:
                  for member in archive.getmembers():
                      data = archive.extractfile(member).read() if member.isfile() else None
                      member.name = member.name.replace(old_root, new_root, 1)
                      # Paths over 100 characters ride PAX headers, which would override the
                      # renamed member.name when the archive is written back out.
                      member.pax_headers.pop("path", None)
                      member.pax_headers.pop("linkpath", None)
                      if member.name == f"{new_root}/PKG-INFO":
                          text, count = re.subn(
                              rf"(?m)^Version: {re.escape(old_version)}$",
                              f"Version: {version}", data.decode(), count=1,
                          )
                          assert count == 1, f"{path.name}: PKG-INFO Version line not found"
                          data = text.encode()
                      elif member.name == f"{new_root}/pyproject.toml":
                          text, count = re.subn(
                              r'(?m)^version = "[^"]+"$',
                              f'version = "{version}"', data.decode(), count=1,
                          )
                          assert count == 1, f"{path.name}: pyproject.toml version not found"
                          data = text.encode()
                      if data is not None:
                          member.size = len(data)
                      members.append((member, data))

              new_path = path.with_name(f"{new_root}.tar.gz")
              with tarfile.open(new_path, "w:gz") as archive:
                  for member, data in members:
                      archive.addfile(member, io.BytesIO(data) if data is not None else None)
              if new_path != path:
                  path.unlink()
              print(f"{path.name} -> {new_path.name}")

          wheels = sorted(Path("to_upload").glob("*.whl"))
          sdists = sorted(Path("to_upload").glob("*.tar.gz"))
          assert wheels, "no wheels to publish"
          for wheel in wheels:
              restamp_wheel(wheel)
          for sdist in sdists:
              restamp_sdist(sdist)

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9  # v9.0.0
        with:
          python-version: '3.12'

      # A restamped wheel whose RECORD no longer matches its contents installs and then fails in
      # confusing ways, so the rewrite is checked before anything reaches PyPI.
      - name: Verify restamped distributions
        run: |
          uvx --from twine==6.2.0 twine check to_upload/*
          ls -la to_upload

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@v1.14.1
        with:
          packages-dir: to_upload
          skip-existing: true

      - name: Checkout repository for version commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Commit version bump to default branch
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Determine version from tag inside Python to avoid env mismatches
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git checkout "$DEFAULT_BRANCH"

          python - <<PY
          import os, re, pathlib, sys
          ref = os.environ.get('REF','')
          if ref.startswith('v_'):
              ver = ref[2:]
          elif ref.startswith('v'):
              ver = ref[1:]
          else:
              print(f'Unexpected tag format: {ref}', file=sys.stderr)
              sys.exit(1)
          print(f'Committing version {ver} to pyproject.toml on default branch')
          p = pathlib.Path('pyproject.toml')
          s = p.read_text(encoding='utf-8')
          new_s, n = re.subn(r'(?m)^(version\s*=\s*")[^"]+("\s*)$', rf"\g<1>{ver}\2", s)
          if n == 0:
              new_s, n = re.subn(r'(?m)^version\s*=\s*"[^"]+"', f'version = "{ver}"', s)
          if n == 0:
              print('ERROR: Could not find version field in pyproject.toml', file=sys.stderr)
              sys.exit(1)
          if new_s != s:
              p.write_text(new_s, encoding='utf-8')
          PY

          # Commit only if changed; push to default branch
          git config --local user.name "github-actions"
          git config --local user.email "github-actions@github.com"
          if ! git diff --quiet -- pyproject.toml; then
            git add pyproject.toml
            # Compute version string for the commit subject from REF (supports v_#.#.# and v#.#.#)
            VER_COMMIT="$REF"
            if [[ "$VER_COMMIT" == v_* ]]; then VER_COMMIT="${VER_COMMIT#v_}"; elif [[ "$VER_COMMIT" == v* ]]; then VER_COMMIT="${VER_COMMIT#v}"; fi
            # [skip ci]: this lands on main, which now builds release-grade wheels on every push.
            # A version-bump commit changes no source, so rebuilding and re-testing it would cost
            # a full matrix run to produce artifacts identical to the ones just published.
            git commit -m "Update version to ${VER_COMMIT} based on tag [skip ci]"
            git push origin HEAD:"$DEFAULT_BRANCH"
          else
            echo "No changes detected in pyproject.toml. Skipping commit and push."
          fi
