# Tap CI (the `brew tap-new` template): builds the formula from source on
# every pull request, runs its `test do` block, and uploads the resulting
# bottles as artifacts for publish.yml to pull. Lives in the tap
# repository, not in hgraph's CI; hgraph's .github/workflows/packaging.yml
# is the pre-release dry run.
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test-bot:
    strategy:
      matrix:
        os:
          # macos-26 is where hgraph's own macOS CI builds. The hosted
          # arm64 runners have 3 cores and 7 GB; the std library's largest
          # translation units do not fit side by side, so the build is
          # serial (the formula passes --parallel to cmake --build).
          - macos-26
          - ubuntu-24.04
    runs-on: ${{ matrix.os }}
    env:
      HOMEBREW_MAKE_JOBS: "1"
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@master

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@v4
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax

      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: bottles_${{ matrix.os }}
          path: "*.bottle.*"
