# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

formats:
  - pdf
  - epub

# The HTML build does not import hgraph, so no compiler or wheel is needed
# here. Diagrams are mermaid (rendered client-side), not plantuml, so there is
# no JRE or graphviz apt dependency either.
python:
  install:
    - requirements: docs/requirements.txt
