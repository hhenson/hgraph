# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  jobs:
    # Install the documentation dependencies from uv.lock so a docs build is
    # reproducible and pinned, rather than re-resolving `>=` ranges on every
    # build. `--no-install-workspace` skips building hgraph itself and
    # `--no-build` forbids building any source distribution, so this stays a
    # wheels-only install needing no compiler. Diagrams are mermaid (rendered
    # client-side), so there is no JRE or graphviz apt dependency either.
    post_create_environment:
      - pip install uv
      - >-
        VIRTUAL_ENV=$READTHEDOCS_VIRTUALENV_PATH
        uv sync --frozen --extra docs --no-install-workspace --no-build --active

sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

